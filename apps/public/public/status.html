<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cek Status Pendaftaran PMMI</title><style>body{font-family:Inter,system-ui;background:#09090b;color:#fafafa;margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(620px,100%);background:#18181b;border:1px solid #3f3f46;border-radius:18px;padding:24px;box-sizing:border-box}input{width:100%;box-sizing:border-box;padding:11px;margin:6px 0;background:#09090b;color:white;border:1px solid #52525b;border-radius:9px}button{padding:10px 14px;background:#a21caf;border:0;border-radius:9px;color:white;cursor:pointer}pre{white-space:pre-wrap;word-break:break-word}</style></head><body><main class="card"><h1>Cek Status Pendaftaran</h1><p>Masukkan ID pendaftaran dan data yang digunakan saat mendaftar.</p><input id="id" placeholder="Application UUID"><input id="email" type="email" placeholder="Email"><input id="phone" placeholder="WhatsApp"><button onclick="check()">Cek Status</button><pre id="out"></pre></main><script>const API=localStorage.getItem('pmmi_api_url')||location.origin.replace(/\/$/,'').replace(/:3003$/,':3001');async function check(){const id=document.getElementById('id').value;const email=document.getElementById('email').value;const phone=document.getElementById('phone').value;let r=await fetch(API+'/v1/admissions/applications/'+encodeURIComponent(id)+'/access-token',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email,phone})});let d=await r.json();if(!r.ok){document.getElementById('out').textContent=d.error||'Tidak ditemukan';return}r=await fetch(API+'/v1/admissions/applications/'+encodeURIComponent(id)+'/status',{headers:{'x-application-token':d.token}});d=await r.json();document.getElementById('out').textContent=JSON.stringify(d,null,2)}</script></body></html>
