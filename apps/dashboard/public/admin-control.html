<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PMMI Admin Control</title><style>body{font-family:Inter,system-ui;background:#09090b;color:#fafafa;margin:0;padding:28px}main{max-width:1050px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.card{background:#18181b;border:1px solid #3f3f46;border-radius:16px;padding:16px}input,textarea,select{width:100%;box-sizing:border-box;padding:9px;margin:5px 0;background:#09090b;color:white;border:1px solid #52525b;border-radius:9px}button{padding:9px 12px;border:0;border-radius:9px;background:#a21caf;color:white;cursor:pointer}pre{white-space:pre-wrap;word-break:break-word;color:#d4d4d8;max-height:320px;overflow:auto}</style></head><body><main><h1>PMMI Admin Control Center</h1><p>Gunakan setelah login ke dashboard pada origin yang sama. Halaman ini memakai token PMMI dari localStorage.</p><div class="grid"><section class="card"><h2>Program</h2><input id="pcode" placeholder="PROGRAMMER"><input id="pname" placeholder="Programmer"><button onclick="post('/v1/admin/programs',{code:v('pcode'),name:v('pname')})">Buat Program</button></section><section class="card"><h2>Cohort</h2><input id="cprogram" placeholder="Program UUID"><input id="cname" placeholder="Programmer 2027"><input id="cyear" type="number" placeholder="2027"><button onclick="post('/v1/admin/cohorts',{programId:v('cprogram')||undefined,name:v('cname'),cohortYear:Number(v('cyear'))})">Buat Cohort</button></section><section class="card"><h2>Course</h2><input id="coursecode" placeholder="WEB101"><input id="coursename" placeholder="Web Development"><button onclick="post('/v1/academic/courses',{code:v('coursecode'),name:v('coursename')})">Buat Course</button></section><section class="card"><h2>Class</h2><input id="classcourse" placeholder="Course UUID"><input id="classcohort" placeholder="Cohort UUID"><input id="classteacher" placeholder="Teacher user UUID"><input id="classname" placeholder="Web Angkatan 2027"><button onclick="post('/v1/admin/classes',{courseId:v('classcourse'),cohortId:v('classcohort')||undefined,teacherUserId:v('classteacher')||undefined,name:v('classname')})">Buat Class</button></section><section class="card"><h2>AI Credit</h2><input id="aiuser" placeholder="User UUID"><input id="aiamount" type="number" placeholder="100"><input id="aireason" placeholder="Bonus seleksi"><button onclick="post('/v1/admin/ai/credits/grant',{userId:v('aiuser'),amount:Number(v('aiamount')),reason:v('aireason')})">Grant Credit</button></section><section class="card"><h2>Reward</h2><input id="rcode" placeholder="HIGH_SCORE"><input id="rname" placeholder="High Score"><input id="rcredit" type="number" placeholder="5"><input id="rslot" type="number" placeholder="1"><button onclick="post('/v1/admin/rewards',{code:v('rcode'),name:v('rname'),aiCredits:Number(v('rcredit')||0),agentSlots:Number(v('rslot')||0)})">Buat Reward</button></section><section class="card"><h2>Reward Rule</h2><input id="rrid" placeholder="Reward UUID"><input id="rrscore" type="number" placeholder="90"><input id="rrcourse" placeholder="WEB101"><button onclick="post('/v1/admin/reward-rules',{rewardId:v('rrid'),eventType:'submission.graded',criteria:{minScore:Number(v('rrscore')||0),courseCode:v('rrcourse')||undefined}})">Buat Rule</button></section><section class="card"><h2>Data</h2><button onclick="get('/v1/admin/users')">Users</button> <button onclick="get('/v1/admin/ops/status')">Ops</button> <button onclick="get('/v1/admin/notifications/deliveries')">Deliveries</button><pre id="out"></pre></section></div></main><script>const API=localStorage.getItem('pmmi_api_url')||location.origin.replace(/\/$/,'')+'/api';const token=localStorage.getItem('pmmi_token');const v=id=>document.getElementById(id).value;async function req(path,opt={}){const r=await fetch(API+path,{...opt,headers:{'content-type':'application/json','authorization':'Bearer '+token,...(opt.headers||{})}});const t=await r.text();let d;try{d=JSON.parse(t)}catch{d=t}document.getElementById('out').textContent=JSON.stringify(d,null,2);if(!r.ok)throw new Error(d.error||d.message||r.status);return d}const post=(p,b)=>req(p,{method:'POST',body:JSON.stringify(b)});const get=p=>req(p);</script></body></html>
