name: PMMI Blueprint CI

on:
  pull_request:
  push:
    branches: [main, 'agent/**']

permissions:
  contents: read

jobs:
  blueprint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pmmi
          POSTGRES_USER: pmmi
          POSTGRES_PASSWORD: pmmi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pmmi -d pmmi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pmmi:pmmi_test@127.0.0.1:5432/pmmi
      JWT_SECRET: ci-only-jwt-secret-at-least-thirty-two-characters
      BOOTSTRAP_ADMIN_TOKEN: ci-bootstrap-token-1234567890
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: pmmi-test
      NINE_ROUTER_URL: http://127.0.0.1:20129
      INITIAL_AI_CREDITS: 100
      INITIAL_HERMES_SLOTS: 1
      NOTIFICATION_TRANSPORT: mock
      WHATSAPP_PROVIDER: disabled
      HERMES_ENABLED: false
      HERMES_BIN: hermes
      ASSIGNMENT_REMINDER_HOURS: 72,24,3
      CLASS_REMINDER_MINUTES: 60
      AI_CREDIT_THRESHOLDS: 50,20,5,0
      VITE_API_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund

      - name: Start MinIO
        run: |
          docker run -d --name pmmi-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin123 \
            minio/minio:latest server /data
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:9000/minio/health/live && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:9000/minio/health/live

      - name: Run migrations
        run: npm run db:migrate

      - name: API blueprint integration tests
        run: npm run test:api

      - name: Worker/outbox integration tests
        run: npm run test:worker

      - name: Build API
        run: npm run build:api

      - name: Build worker
        run: npm run build:worker

      - name: Build public website
        run: npm run build:web

      - name: Build role dashboard
        run: npm run build:dashboard

      - name: Build WhatsApp Baileys sidecar
        run: npm run build:whatsapp

      - name: Validate mounted frontend and operator surfaces
        run: npm run validate:ui

      - name: Validate operational scripts
        run: bash -n infra/scripts/backup.sh infra/scripts/restore.sh infra/scripts/health-check.sh infra/scripts/ops-monitor.sh

      - name: Validate Docker Compose
        run: |
          docker compose --env-file infra/docker/.env.example -f infra/docker/compose.yml config >/dev/null
          docker compose --profile baileys --env-file infra/docker/.env.example -f infra/docker/compose.yml config >/dev/null

      - name: Build production images
        run: |
          docker build -f infra/docker/Dockerfile.api -t pmmi-api:ci .
          docker build -f infra/docker/Dockerfile.worker -t pmmi-worker:ci .
          docker build --build-arg VITE_API_URL=http://localhost:3001 -f infra/docker/Dockerfile.web -t pmmi-web:ci .
          docker build --build-arg VITE_API_URL=http://localhost:3001 -f infra/docker/Dockerfile.dashboard -t pmmi-dashboard:ci .
          docker build -f infra/docker/Dockerfile.whatsapp -t pmmi-whatsapp:ci .
