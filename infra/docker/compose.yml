services:
  api:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev:api"
    volumes:
      - ../..:/app
    environment:
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://host.docker.internal:9000}
    ports:
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev:worker"
    volumes:
      - ../..:/app
    environment:
      DATABASE_URL: ${DATABASE_URL}

# PostgreSQL and MinIO are intentionally not duplicated here.
# PMMI connects to the existing home-server services.
