x-api-env: &api-env
  DATABASE_URL: ${DATABASE_URL}
  JWT_SECRET: ${JWT_SECRET}
  BOOTSTRAP_ADMIN_TOKEN: ${BOOTSTRAP_ADMIN_TOKEN:-}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://host.docker.internal:9000}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
  MINIO_BUCKET: ${MINIO_BUCKET:-pmmi}
  PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-https://pondokmultimedia.id}
  DASHBOARD_URL: ${DASHBOARD_URL:-https://app.pondokmultimedia.id}
  CORS_ORIGINS: ${CORS_ORIGINS:-https://pondokmultimedia.id,https://app.pondokmultimedia.id}
  INITIAL_AI_CREDITS: ${INITIAL_AI_CREDITS:-100}
  INITIAL_HERMES_SLOTS: ${INITIAL_HERMES_SLOTS:-1}
  INITIAL_STORAGE_QUOTA_BYTES: ${INITIAL_STORAGE_QUOTA_BYTES:-1073741824}
  # URL 9Router DARI DALAM container: nama container pmmi-9router di network compose (bukan host).
  # Untuk skrip HOST (ops-monitor dll) pakai NINE_ROUTER_URL=http://127.0.0.1:20128 di .env.
  NINE_ROUTER_URL: http://pmmi-9router:20128
  NINE_ROUTER_API_KEY: ${NINE_ROUTER_API_KEY:-}
  AI_REQUEST_RESERVE_CREDITS: ${AI_REQUEST_RESERVE_CREDITS:-5}
  AI_TOKENS_PER_CREDIT: ${AI_TOKENS_PER_CREDIT:-1000}
  HERMES_WORKSPACE_ROOT: ${HERMES_WORKSPACE_ROOT:-/srv/pmmi/workspaces}
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
  RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
  OPS_TOKEN: ${OPS_TOKEN:-}

x-worker-env: &worker-env
  DATABASE_URL: ${DATABASE_URL}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://host.docker.internal:9000}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
  MINIO_BUCKET: ${MINIO_BUCKET:-pmmi}
  WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-3000}
  WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-20}
  NOTIFICATION_TRANSPORT: ${NOTIFICATION_TRANSPORT:-live}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  EMAIL_FROM: ${EMAIL_FROM:-PMMI <noreply@pondokmultimedia.id>}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-disabled}
  BAILEYS_GATEWAY_URL: ${BAILEYS_GATEWAY_URL:-http://whatsapp:3010}
  BAILEYS_SERVICE_TOKEN: ${BAILEYS_SERVICE_TOKEN:-}
  META_WHATSAPP_URL: ${META_WHATSAPP_URL:-}
  META_WHATSAPP_TOKEN: ${META_WHATSAPP_TOKEN:-}
  HERMES_ENABLED: ${HERMES_ENABLED:-false}
  HERMES_BIN: ${HERMES_BIN:-hermes}
  HERMES_TEMPLATE_PROFILE: ${HERMES_TEMPLATE_PROFILE:-}
  HERMES_START_GATEWAY: ${HERMES_START_GATEWAY:-false}
  MAX_DELIVERY_ATTEMPTS: ${MAX_DELIVERY_ATTEMPTS:-5}
  ASSIGNMENT_REMINDER_HOURS: ${ASSIGNMENT_REMINDER_HOURS:-72,24,3}
  CLASS_REMINDER_MINUTES: ${CLASS_REMINDER_MINUTES:-60}
  AI_CREDIT_THRESHOLDS: ${AI_CREDIT_THRESHOLDS:-50,20,5,0}

services:
  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    command: ["npm","run","db:migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    environment:
      <<: *api-env
      PORT: 3001
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD","wget","-qO-","http://127.0.0.1:3001/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    environment: *worker-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  whatsapp:
    profiles: ["baileys"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.whatsapp
    environment:
      PORT: 3010
      HOST: 0.0.0.0
      BAILEYS_AUTH_DIR: ${BAILEYS_AUTH_DIR:-/data/auth}
      BAILEYS_SERVICE_TOKEN: ${BAILEYS_SERVICE_TOKEN}
    volumes:
      - pmmi-whatsapp-auth:/data/auth
    ports:
      - "127.0.0.1:3010:3010"
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:3010/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-https://ai.pondokmultimedia.id}
        VITE_DASHBOARD_URL: ${DASHBOARD_URL:-https://app.pondokmultimedia.id}
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD","wget","-qO-","http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  dashboard:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.dashboard
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-https://ai.pondokmultimedia.id}
        VITE_DASHBOARD_URL: ${DASHBOARD_URL:-https://app.pondokmultimedia.id}
    ports:
      - "127.0.0.1:8081:80"
    healthcheck:
      test: ["CMD","wget","-qO-","http://127.0.0.1/healthz"]
      timeout: 5s
      retries: 3
    restart: unless-stopped

  9router:
    image: decolua/9router:latest
    ports:
      - "127.0.0.1:20128:20128"
    volumes:
      - 9router-data:/data
    restart: unless-stopped

volumes:
  pmmi-whatsapp-auth:
  9router-data:

# PostgreSQL, MinIO, Immich, Tailscale, 9Router and the single shared Hermes runtime
# remain external home-server services. The optional \`baileys\` Compose profile runs the
# isolated PMMI WhatsApp sidecar with persistent auth state; use only one paired PMMI account.
# When Hermes is enabled, disable this Docker worker and use the hardened host/custom worker
# that has access to the shared Hermes runtime; never install Hermes per user.
