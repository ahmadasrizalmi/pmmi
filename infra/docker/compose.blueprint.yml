x-core-env: &core-env
  DATABASE_URL: ${DATABASE_URL}
  JWT_SECRET: ${JWT_SECRET}
  BOOTSTRAP_ADMIN_TOKEN: ${BOOTSTRAP_ADMIN_TOKEN:-}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://host.docker.internal:9000}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
  MINIO_BUCKET: ${MINIO_BUCKET:-pmmi}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://app.pondokmultimedia.id}
  NINEROUTER_BASE_URL: ${NINEROUTER_BASE_URL:-http://host.docker.internal:20128}
  NINEROUTER_API_KEY: ${NINEROUTER_API_KEY:-}
  AI_REQUESTS_PER_MINUTE: ${AI_REQUESTS_PER_MINUTE:-20}
  HERMES_WORKSPACE_BASE: ${HERMES_WORKSPACE_BASE:-/srv/pmmi/workspaces}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}

services:
  migrate:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run db:migrate"
    volumes: ["../..:/app"]
    environment: *core-env
    extra_hosts: ["host.docker.internal:host-gateway"]

  api:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run build --workspace @pmmi/api && node apps/api/dist/blueprintIndex.js"
    volumes: ["../..:/app"]
    environment:
      <<: *core-env
      PORT: 3001
      HOST: 0.0.0.0
    ports: ["127.0.0.1:3001:3001"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  public-site:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run build && npm run preview -- --host 0.0.0.0 --port 3000"
    volumes: ["../..:/app"]
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped

  public-extensions:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run build --workspace @pmmi/web && npm run preview --workspace @pmmi/web -- --host 0.0.0.0 --port 3003"
    volumes: ["../..:/app"]
    environment:
      VITE_API_URL: ${PUBLIC_API_URL:-https://app.pondokmultimedia.id/api}
    ports: ["127.0.0.1:3003:3003"]
    restart: unless-stopped

  dashboard:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run build --workspace @pmmi/dashboard && npm run preview --workspace @pmmi/dashboard -- --host 0.0.0.0 --port 3002"
    volumes: ["../..:/app"]
    environment:
      VITE_API_URL: ${PUBLIC_API_URL:-https://app.pondokmultimedia.id/api}
    ports: ["127.0.0.1:3002:3002"]
    restart: unless-stopped

  whatsapp:
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run build --workspace @pmmi/whatsapp && npm run start --workspace @pmmi/whatsapp"
    volumes:
      - ../..:/app
      - whatsapp-auth:/data/auth
    environment:
      PORT: 3010
      HOST: 0.0.0.0
      WHATSAPP_PROVIDER_TOKEN: ${WHATSAPP_PROVIDER_TOKEN}
      WHATSAPP_PAIRING_PHONE: ${WHATSAPP_PAIRING_PHONE:-}
      WHATSAPP_AUTH_DIR: /data/auth
    ports: ["127.0.0.1:3010:3010"]
    restart: unless-stopped

  webhooks:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run build --workspace @pmmi/webhooks && npm run start --workspace @pmmi/webhooks"
    volumes: ["../..:/app"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET}
      PORT: 3011
      HOST: 0.0.0.0
    ports: ["127.0.0.1:3011:3011"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  jobs-container:
    profiles: ["container-jobs"]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run build --workspace @pmmi/jobs && npm run start --workspace @pmmi/jobs"
    volumes: ["../..:/app"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NOTIFICATION_MODE: real
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-PMMI <noreply@pondokmultimedia.id>}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      WHATSAPP_PROVIDER_URL: http://whatsapp:3010
      WHATSAPP_PROVIDER_TOKEN: ${WHATSAPP_PROVIDER_TOKEN}
      HERMES_EXECUTION_MODE: disabled
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      whatsapp: { condition: service_started }
    restart: unless-stopped

volumes:
  whatsapp-auth:

# Production recommendation:
# - run apps/jobs via infra/systemd/pmmi-jobs.service on the Ubuntu host, HERMES_EXECUTION_MODE=real;
# - keep the existing public Vite site on :3000;
# - reverse proxy only /daftar and /portfolio* to :3003;
# - reverse proxy app.pondokmultimedia.id to dashboard :3002 and /api to API :3001;
# - expose webhook path to :3011/resend; PostgreSQL/MinIO/9Router remain private/host-level.
